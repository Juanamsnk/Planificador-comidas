<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qué comemos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Manrope:wght@400;500;600;700&display=swap');

  :root{
    --ink:#14171A;
    --surface:#1D2225;
    --surface-2:#242A2E;
    --surface-hover:#2D343A;
    --paper:#F1F0EA;
    --muted:#8D949B;
    --line: rgba(241,240,234,0.08);
    --line-strong: rgba(241,240,234,0.18);
    --herb:#8FC46E;
    --herb-deep:#6FA34E;
    --herb-ink:#12210D;
    --gold:#E8B24D;
    --plum:#7C93C4;
    --rust:#E2735A;
    --shadow: 0 20px 44px rgba(0,0,0,0.45);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{
    font-family:'Manrope', sans-serif;
    color:var(--paper);
    background:var(--ink);
  }

  .wrap{max-width:980px; margin:0 auto; padding:36px 22px 70px;}

  .topbar{margin-bottom:10px;}
  .header-row{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .brand h1{
    font-family:'Newsreader', serif;
    font-style:italic;
    font-weight:500;
    font-size:2.4rem;
    margin:0;
    color:var(--paper);
    letter-spacing:-0.01em;
  }

  .calendar-owner-badge{
    display:inline-flex; align-items:center; gap:6px;
    font-size:0.75rem; font-weight:600;
    color:var(--herb); background:rgba(143,196,110,0.12);
    border:1px solid rgba(143,196,110,0.35);
    border-radius:100px; padding:5px 13px; margin:14px 0 0;
  }
  .calendar-owner-badge.shared{ color:var(--plum); background:rgba(124,147,196,0.14); border-color:rgba(124,147,196,0.4); }

  .demo-badge{
    background:rgba(232,178,77,0.14); border:1px solid rgba(232,178,77,0.4);
    color:var(--gold); border-radius:100px; padding:7px 15px; font-size:0.8rem;
    display:inline-block; margin-top:14px;
  }
  .guest-note{font-size:0.82rem; color:var(--muted); margin-top:14px;}

  .menu-wrap{position:relative; flex-shrink:0;}
  .menu-btn{
    width:40px;height:40px;border-radius:12px;
    background:var(--surface); border:1px solid var(--line-strong);
    color:var(--paper); font-size:1.05rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .menu-btn:hover{background:var(--surface-hover);}
  .dropdown-menu{
    position:absolute; top:48px; right:0; min-width:240px;
    background:var(--surface); border:1px solid var(--line-strong);
    border-radius:14px; box-shadow:var(--shadow); padding:10px; z-index:60;
  }
  .menu-section-label{font-size:0.68rem; letter-spacing:0.04em; color:var(--muted); padding:6px 10px 4px;}
  .menu-item{
    display:block; width:100%; text-align:left; background:none; border:none;
    padding:10px 11px; border-radius:9px; font-size:0.87rem; cursor:pointer;
    color:var(--paper); font-family:'Manrope', sans-serif;
  }
  .menu-item:hover{background:var(--surface-hover);}
  .menu-item.active{background:rgba(143,196,110,0.16); color:var(--herb); font-weight:700;}
  .menu-item.danger{color:#E2735A;}
  .menu-item.danger:hover{background:rgba(226,115,90,0.15);}
  .calendar-menu-row{display:flex; align-items:center; gap:4px;}
  .calendar-menu-row .menu-item{flex:1; min-width:0;}
  .leave-menu-btn{
    width:28px;height:28px;flex:0 0 28px;border:0;border-radius:50%;
    background:transparent;color:#E2735A;font-size:1.1rem;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .leave-menu-btn:hover{background:rgba(226,115,90,0.15);}
  .menu-divider{height:1px; background:var(--line-strong); margin:7px 4px;}

  .week-nav{
    display:flex; align-items:center; justify-content:space-between;
    margin:26px 0 18px; gap:10px;
  }
  .nav-group{display:flex; gap:8px; align-items:center; flex-shrink:0;}
  .nav-btn{
    width:38px;height:38px;border-radius:10px;
    background:var(--surface); border:1px solid var(--line-strong);
    color:var(--paper); font-size:1.05rem; cursor:pointer;
  }
  .nav-btn:hover{background:var(--surface-hover);}
  .today-btn{
    font-size:0.78rem; background:none; border:1px solid var(--line-strong);
    border-radius:10px; padding:0 12px; height:38px; cursor:pointer; color:var(--paper);
  }
  .today-btn:hover{background:var(--surface-hover);}
  .week-nav .label{
    flex:1; text-align:center; font-family:'Newsreader', serif; font-size:1.25rem;
    font-weight:500; color:var(--paper); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .week-nav .label .yr{font-family:'Manrope',sans-serif; font-weight:400; font-size:0.78rem; color:var(--muted); margin-left:6px;}
  .nav-spacer{width:80px; flex-shrink:0;}

  .week-grid{
    display:grid; grid-template-columns:repeat(7,1fr); gap:10px;
  }
  .day-card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:12px 10px 14px; display:flex; flex-direction:column; gap:10px;
    min-width:0;
  }
  .day-card.is-today{ border-color:var(--herb); box-shadow:0 0 0 1px var(--herb) inset; }
  .day-card-head{ text-align:center; padding-bottom:8px; border-bottom:1px solid var(--line); }
  .day-name{ display:block; font-size:0.7rem; letter-spacing:0.03em; color:var(--muted); }
  .day-card.is-today .day-name{ color:var(--herb); }
  .day-num{ display:block; font-family:'Newsreader', serif; font-size:1.2rem; color:var(--paper); margin-top:1px; }

  .day-meals{ display:flex; flex-direction:column; gap:10px; }

  .meal-slot{ display:flex; flex-direction:column; gap:5px; }
  .meal-tag{
    font-size:0.62rem; letter-spacing:0.03em; font-weight:600;
    display:inline-flex; align-items:center; gap:5px; color:var(--muted);
  }
  .meal-tag::before{ content:''; width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .meal-slot--comida .meal-tag::before{ background:var(--gold); }
  .meal-slot--cena .meal-tag::before{ background:var(--plum); }

  .cell-btn{
    width:100%; min-height:54px; border:1px dashed var(--line-strong); border-radius:10px;
    background:var(--surface-2); text-align:left; padding:8px 9px; cursor:pointer;
    font-family:'Manrope', sans-serif; color:var(--paper);
    display:flex; flex-direction:column; justify-content:center; gap:2px;
  }
  .cell-btn:hover{ background:var(--surface-hover); border-color:var(--herb); }
  .cell-btn.selected{ border:1px solid var(--herb); background:rgba(143,196,110,0.14); }
  .cell-dish{ font-size:0.85rem; line-height:1.25; }
  .cell-empty{ font-size:0.78rem; color:var(--muted); }
  .cell-meta{ font-size:0.64rem; color:var(--muted); }

  .edit-panel{
    margin-top:24px; background:var(--surface); border:1px solid var(--line-strong);
    border-radius:16px; padding:22px 24px;
  }
  .edit-panel h3{ font-family:'Newsreader', serif; font-size:1.2rem; font-weight:500; margin:0 0 16px; color:var(--paper); }

  .row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .field{ display:flex; flex-direction:column; gap:6px; flex:1; min-width:140px; }
  label{ font-size:0.74rem; color:var(--muted); }
  input[type=text], input[type=password], input[type=date], input[type=time]{
    font-family:'Manrope', sans-serif; font-size:0.9rem; padding:10px 12px;
    border:1px solid var(--line-strong); border-radius:10px;
    background:var(--ink); color:var(--paper);
  }
  input::placeholder{ color:#736A5C; }
  input:focus{ outline:2px solid var(--herb); outline-offset:1px; }

  .reminder-line{
    font-size:0.8rem; color:var(--muted); display:flex; align-items:center; gap:8px;
    flex-wrap:wrap; margin-bottom:16px;
  }
  .reminder-line input[type=checkbox]{ accent-color:var(--herb); width:16px; height:16px; }
  .reminder-line input[type=date], .reminder-line input[type=time]{ padding:7px 9px; font-size:0.8rem; }

  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn{
    font-family:'Manrope', sans-serif; font-size:0.85rem; font-weight:600;
    padding:10px 16px; border-radius:10px; cursor:pointer;
    border:1px solid var(--line-strong); background:var(--surface-2); color:var(--paper);
  }
  .btn:hover{ background:var(--surface-hover); }
  .btn.primary{ background:var(--herb); color:var(--herb-ink); border-color:var(--herb); }
  .btn.primary:hover{ background:var(--herb-deep); }
  .btn.danger{ color:#E2735A; border-color:rgba(226,115,90,0.4); }
  .btn.danger:hover{ background:rgba(226,115,90,0.15); }
  .btn.ghost{ background:none; }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--paper); color:var(--ink); padding:11px 20px; border-radius:10px;
    font-size:0.85rem; font-weight:600; opacity:0; transition:all 0.25s ease; pointer-events:none; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:600px){
    .wrap{ padding:24px 16px 56px; }
    .brand h1{ font-size:1.9rem; }
    .week-grid{
      display:flex; flex-direction:column; gap:10px;
    }
    .day-card{
      flex-direction:row; align-items:stretch; gap:12px; padding:12px;
    }
    .day-card-head{
      flex:0 0 58px; border-bottom:none; border-right:1px solid var(--line);
      padding:0 12px 0 0; display:flex; flex-direction:column; justify-content:center; text-align:left;
    }
    .day-meals{ flex:1; min-width:0; }
    .dropdown-menu{ min-width:210px; max-width:calc(100vw - 32px); }
    .week-nav{ gap:6px; }
    .nav-btn{ width:34px; height:34px; }
    .nav-spacer{ display:none; }
    .week-nav .label{ font-size:1.05rem; }
    .today-btn{ font-size:0.72rem; padding:0 8px; height:34px; }
    .row{ gap:8px; }
    .field{ min-width:100%; }
    .btn{ padding:9px 13px; font-size:0.82rem; }
  }
</style>
</head>
<body>
<div id="root" class="wrap"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

    storageBucket: "que-comemos-146b7.firebasestorage.app",

<script>
(function(){
  const root = document.getElementById('root');
  const DAY_NAMES = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  let data = {};       // key: "YYYY-MM-DD|comida" or "|cena" -> {dish,time,reminderDate,reminderTime}
  let loaded = false;
  let weekOffset = 0;  // 0 = current week
  let selected = null; // {date, type}
  let focusDishOnOpen = false;
  let menuOpen = false;
  let didAutoScrollToday = false;
  const isDemo = new URLSearchParams(window.location.search).get('demo') === '1';
  const urlCal = new URLSearchParams(window.location.search).get('cal');

  let mealsRef = null;
  let calendarId = null;
  let ownCalendarId = null;
  let isOwner = false;
  let authUser = null;
  let authError = '';
  let sharedCalendars = {};   // { calId: true }
  let calendarLabels = {};    // { calId: "nombre a mostrar" }

  function pad(n){ return String(n).padStart(2,'0'); }
  function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

  function getMondayOfCurrentWeek(){
    const d = new Date();
    const day = d.getDay(); // 0=domingo
    const diff = (day === 0 ? -6 : 1 - day);
    d.setDate(d.getDate()+diff);
    d.setHours(0,0,0,0);
    return d;
  }

  function weekDates(offset){
    const monday = getMondayOfCurrentWeek();
    monday.setDate(monday.getDate() + offset*7);
    const arr = [];
    for(let i=0;i<7;i++){
      const d = new Date(monday);
      d.setDate(monday.getDate()+i);
      arr.push(d);
    }
    return arr;
  }

  function key(dateStr, type){ return dateStr+'|'+type; }

  function currentWeekDateSet(){
    return new Set(weekDates(weekOffset).map(fmtDate));
  }

  function randomOtherWeekDish(){
    const excluded = currentWeekDateSet();
    const candidates = [];
    Object.keys(data).forEach(k=>{
      const entry = data[k];
      if(!entry || !entry.dish) return;
      const dateStr = k.split('|')[0];
      if(!excluded.has(dateStr)) candidates.push(entry.dish);
    });
    if(candidates.length === 0) return null;
    return candidates[Math.floor(Math.random()*candidates.length)];
  }

  function leastRecentDish(){
    const lastSeen = {};
    Object.keys(data).forEach(k=>{
      const entry = data[k];
      if(!entry || !entry.dish) return;
      const dateStr = k.split('|')[0];
      if(!lastSeen[entry.dish] || dateStr > lastSeen[entry.dish]) lastSeen[entry.dish] = dateStr;
    });
    const dishes = Object.keys(lastSeen);
    if(dishes.length === 0) return null;
    dishes.sort((a,b)=> lastSeen[a].localeCompare(lastSeen[b]));
    return dishes[0];
  }

  function formatDayLabel(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    return `${DAY_NAMES[d.getDay()===0?6:d.getDay()-1]} ${d.getDate()} de ${MONTHS[d.getMonth()]}`;
  }

  function defaultReminder(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    d.setDate(d.getDate()-1);
    return { date: fmtDate(d), time: '12:00' };
  }

  function toIcsUtc(dateObj){
    return dateObj.getUTCFullYear()+pad(dateObj.getUTCMonth()+1)+pad(dateObj.getUTCDate())
      +'T'+pad(dateObj.getUTCHours())+pad(dateObj.getUTCMinutes())+'00Z';
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2200);
  }

  function loadData(){
    mealsRef.on('value', (snapshot)=>{
      data = snapshot.val() || {};
      loaded = true;
      render();
    }, (err)=>{
      showToast('No se pudo conectar con la base de datos.');
    });
  }

  async function saveData(){
    if(isDemo) return; // modo demo: no se guarda nada de verdad
    try{ await mealsRef.set(data); }
    catch(e){ showToast('No se pudo guardar. Inténtalo de nuevo.'); }
  }

  function loadCalendar(id, ownerFlag){
    if(mealsRef) mealsRef.off();
    calendarId = id;
    isOwner = ownerFlag;
    loaded = false;
    if(!ownerFlag) fetchCalendarLabel(id);
    mealsRef = firebase.database().ref('calendars/'+id+'/mealplan');
    loadData();
  }

  async function migrateLegacyDataIfNeeded(uid){
    // La primera vez que el usuario principal se registra, si su calendario nuevo
    // está vacío y existía el calendario antiguo (compartido sin cuentas), lo copiamos.
    try{
      const newSnap = await firebase.database().ref('calendars/'+uid+'/mealplan').once('value');
      if(newSnap.exists()) return;
      const legacySnap = await firebase.database().ref('mealplan').once('value');
      if(legacySnap.exists()){
        await firebase.database().ref('calendars/'+uid+'/mealplan').set(legacySnap.val());
      }
    }catch(e){ /* si falla la migración, simplemente empieza vacío */ }
  }

  function startAsDemo(){
    calendarId = null; isOwner = false;
    data = {}; loaded = true; render();
  }

  function startAsGuest(cal){
    loadCalendar(cal, false);
  }

  function fetchCalendarLabel(id){
    if(calendarLabels[id]) return;
    firebase.database().ref('calendars/'+id+'/ownerLabel').once('value').then(snap=>{
      calendarLabels[id] = snap.val() || 'Calendario compartido';
      render();
    }).catch(()=>{ calendarLabels[id] = 'Calendario compartido'; });
  }

  function listenSharedCalendars(uid){
    firebase.database().ref('users/'+uid+'/shared').on('value', (snap)=>{
      sharedCalendars = snap.val() || {};
      Object.keys(sharedCalendars).forEach(fetchCalendarLabel);
      render();
    });
  }

  async function startAsOwner(uid){
    ownCalendarId = uid;
    await migrateLegacyDataIfNeeded(uid);
    firebase.database().ref('calendars/'+uid+'/ownerLabel').set(authUser.displayName || authUser.email || 'Mi calendario');
    listenSharedCalendars(uid);

    if(urlCal && urlCal !== uid){
      await firebase.database().ref('users/'+uid+'/shared/'+urlCal).set(true);
      history.replaceState({}, '', window.location.pathname);
      loadCalendar(urlCal, false);
    } else {
      loadCalendar(uid, true);
    }
  }

  function initRouting(){
    if(isDemo){ startAsDemo(); return; }
    firebase.auth().getRedirectResult().catch((e)=>{
      authError = 'No se pudo iniciar sesión (' + (e.code||'error') + '). Comprueba que el dominio esté autorizado.';
    });
    firebase.auth().onAuthStateChanged((user)=>{
      if(user){
        authUser = user;
        startAsOwner(user.uid);
      } else if(urlCal){
        startAsGuest(urlCal);
      } else {
        authUser = null;
        loaded = true;
        renderAuthScreen();
      }
    });
  }

  function renderAuthScreen(){
    root.innerHTML = `
      <header class="topbar">
        <div class="brand"><h1>Qué comemos</h1></div>
      </header>
      <div class="edit-panel" style="max-width:400px; margin:30px auto 0; text-align:center;">
        <h3>Accede a tu calendario</h3>
        <p style="font-size:0.85rem; color:var(--muted); margin-bottom:18px;">Inicia sesión con tu cuenta de Google para crear o entrar en tu calendario de comidas.</p>
        ${authError ? `<p style="color:#E2735A; font-size:0.82rem; margin:0 0 14px;">${escapeHtml(authError)}</p>` : ''}
        <div class="btn-row" style="justify-content:center;">
          <button class="btn primary" id="googleLoginBtn">Iniciar sesión con Google</button>
        </div>
      </div>
      <div class="toast" id="toast"></div>
    `;

    document.getElementById('googleLoginBtn').addEventListener('click', async ()=>{
      const provider = new firebase.auth.GoogleAuthProvider();
      try{
        await firebase.auth().signInWithPopup(provider);
      }catch(e){
        if(e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment'){
          try{
            await firebase.auth().signInWithRedirect(provider);
          }catch(e2){
            authError = 'No se pudo iniciar sesión (' + (e2.code||'error') + ').';
            renderAuthScreen();
          }
        } else if(e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request'){
          authError = 'No se pudo iniciar sesión (' + (e.code||'error') + ').';
          renderAuthScreen();
        }
      }
    });
  }

  function downloadIcs(entry, dateStr, type){
    const mealLabel = formatDayLabel(dateStr);
    let start;
    if(entry.reminderDate && entry.reminderTime){
      // El evento ocurre en el momento del recordatorio, no el día de la comida,
      // porque Google Calendar suele ignorar la alarma personalizada de un .ics importado
      // pero sí avisa de forma fiable a la hora de inicio del propio evento.
      start = new Date(entry.reminderDate+'T'+entry.reminderTime+':00');
    } else {
      const mealTime = type==='comida' ? '14:00' : '21:00';
      start = new Date(dateStr+'T'+mealTime+':00');
    }
    const end = new Date(start.getTime()+30*60*1000);
    const uid = dateStr+'-'+type+'@quecomemos';
    const now = new Date();
    const reminderLabel = entry.reminderTitle && entry.reminderTitle.trim() ? entry.reminderTitle.trim() : entry.dish;
    const alarmBlock = [
      'BEGIN:VALARM',
      'ACTION:DISPLAY',
      'DESCRIPTION:Recordatorio: '+reminderLabel,
      'TRIGGER:PT0M',
      'END:VALARM'
    ].join('\r\n');
    const summary = 'Recordatorio: ' + reminderLabel;
    const description = (type==='comida'?'Comida':'Cena') + ' prevista para ' + mealLabel + ': ' + entry.dish + '.';
    const ics = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Que Comemos//ES','CALSCALE:GREGORIAN',
      'BEGIN:VEVENT','UID:'+uid,'DTSTAMP:'+toIcsUtc(now),'DTSTART:'+toIcsUtc(start),
      'DTEND:'+toIcsUtc(end),'SUMMARY:'+summary,'DESCRIPTION:'+description, alarmBlock, 'END:VEVENT','END:VCALENDAR'
    ].filter(Boolean).join('\r\n');
    const blob = new Blob([ics], {type:'text/calendar'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (entry.dish||'comida').replace(/[^a-z0-9]+/gi,'_').toLowerCase()+'.ics';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.addEventListener('click', (e)=>{
    if(menuOpen && !e.target.closest('.menu-wrap')){
      menuOpen = false;
      render();
    }
  });

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function render(){
    if(!loaded){ root.innerHTML = '<div style="padding:60px 20px;text-align:center;color:var(--muted);">Cargando plan de comidas…</div>'; return; }

    const dates = weekDates(weekOffset);
    const todayStr = fmtDate(new Date());
    const first = dates[0], last = dates[6];
    const rangeLabel = first.getMonth() === last.getMonth()
      ? `${first.getDate()} – ${last.getDate()} de ${MONTHS[first.getMonth()]}`
      : `${first.getDate()} ${MONTHS[first.getMonth()]} – ${last.getDate()} ${MONTHS[last.getMonth()]}`;

    function cellContent(dateStr, type){
      const entry = data[key(dateStr,type)];
      const isSel = selected && selected.date===dateStr && selected.type===type;
      if(!entry || !entry.dish){
        return `<button class="cell-btn ${isSel?'selected':''}" data-date="${dateStr}" data-type="${type}">
          <span class="cell-empty">+ añadir</span>
        </button>`;
      }
      const metaBits = [];
      if(entry.reminderDate && entry.reminderTime) metaBits.push('aviso ' + entry.reminderTime);
      return `<button class="cell-btn ${isSel?'selected':''}" data-date="${dateStr}" data-type="${type}">
        <span class="cell-dish">${escapeHtml(entry.dish)}</span>
        <span class="cell-meta">${metaBits.join(' · ')}</span>
      </button>`;
    }

    const menuHtml = (authUser && ownCalendarId) ? `
      <div class="dropdown-menu" id="dropdownMenu">
        <div class="menu-section-label">Calendarios</div>
        <button class="menu-item ${calendarId===ownCalendarId ? 'active' : ''}" data-cal-switch="${ownCalendarId}" data-cal-owner="1">Mi calendario</button>
        ${Object.keys(sharedCalendars).map(id => `
          <div class="calendar-menu-row">
            <button class="menu-item ${calendarId===id ? 'active' : ''}" data-cal-switch="${id}" data-cal-owner="0">${escapeHtml(calendarLabels[id] || 'Calendario compartido')}</button>
            <button class="leave-menu-btn" data-leave-calendar="${id}" title="Quitar calendario" aria-label="Quitar calendario">×</button>
          </div>
        `).join('')}
        <div class="menu-divider"></div>
        ${calendarId === ownCalendarId ? '<button class="menu-item" id="shareRealMenuBtn">Compartir enlace</button>' : ''}
        <div class="menu-divider"></div>
        <button class="menu-item" id="shareDemoBtn">Compartir enlace de demostración</button>
        <div class="menu-divider"></div>
        <button class="menu-item danger" id="logoutBtn">Cerrar sesión</button>
      </div>
    ` : '';

    const ownerBadgeHtml = (!isDemo && calendarId)
      ? `<p class="calendar-owner-badge ${isOwner ? '' : 'shared'}">
          ${isOwner ? 'Tu calendario' : 'Calendario de ' + escapeHtml(calendarLabels[calendarId] || 'otra persona')}
         </p>`
      : '';

    root.innerHTML = `
      <header class="topbar">
        <div class="header-row">
          <div class="brand"><h1>Qué comemos</h1></div>
          ${(!isDemo && authUser) ? `
            <div class="menu-wrap">
              <button class="menu-btn" id="menuToggleBtn" aria-label="Menú" aria-expanded="${menuOpen ? 'true' : 'false'}">☰</button>
              ${menuOpen ? menuHtml : ''}
            </div>` : ''}
        </div>
        ${ownerBadgeHtml}
        ${isDemo
          ? '<p class="demo-badge">Modo demostración: los cambios no se guardan.</p>'
          : (!authUser ? '<p class="guest-note">Estás viendo este calendario porque alguien te ha compartido su enlace.</p>' : '')
        }
      </header>

      <div class="week-nav">
        <div class="nav-group">
          <button class="nav-btn" id="prevWeek">‹</button>
          <button class="nav-btn" id="nextWeek">›</button>
          ${weekOffset !== 0 ? '<button class="today-btn" id="goToday">Esta semana</button>' : ''}
        </div>
        <div class="label">${rangeLabel} <span class="yr">${first.getFullYear()}</span></div>
        <div class="nav-spacer"></div>
      </div>

      <div class="week-grid">
        ${dates.map(d=>{
          const dateStr = fmtDate(d);
          const isToday = dateStr === todayStr;
          return `<div class="day-card ${isToday?'is-today':''}">
            <div class="day-card-head">
              <span class="day-name">${DAY_NAMES[d.getDay()===0?6:d.getDay()-1]}</span>
              <span class="day-num">${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}</span>
            </div>
            <div class="day-meals">
              <div class="meal-slot meal-slot--comida">
                <span class="meal-tag">Comida</span>
                ${cellContent(dateStr,'comida')}
              </div>
              <div class="meal-slot meal-slot--cena">
                <span class="meal-tag">Cena</span>
                ${cellContent(dateStr,'cena')}
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>

      <div id="editSlot"></div>
      <div class="toast" id="toast"></div>
    `;

    document.getElementById('prevWeek').addEventListener('click', ()=>{ weekOffset--; render(); });
    document.getElementById('nextWeek').addEventListener('click', ()=>{ weekOffset++; render(); });
    const todayBtn = document.getElementById('goToday');
    if(todayBtn) todayBtn.addEventListener('click', ()=>{ weekOffset=0; render(); });

    const menuToggleBtn = document.getElementById('menuToggleBtn');
    if(menuToggleBtn){
      menuToggleBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        menuOpen = !menuOpen;
        render();
      });
    }

    document.querySelectorAll('[data-cal-switch]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const targetId = btn.getAttribute('data-cal-switch');
        const isOwnerTarget = btn.getAttribute('data-cal-owner') === '1';
        menuOpen = false;
        if(targetId === calendarId) { render(); return; }
        selected = null;
        loadCalendar(targetId, isOwnerTarget);
      });
    });

    const shareRealMenuBtn = document.getElementById('shareRealMenuBtn');
    if(shareRealMenuBtn){
      shareRealMenuBtn.addEventListener('click', async ()=>{
        if(calendarId !== ownCalendarId) return;
        const realUrl = window.location.origin + window.location.pathname + '?cal=' + ownCalendarId;
        menuOpen = false;
        render();
        if(navigator.share){
          try{ await navigator.share({ title:'Qué comemos', url: realUrl }); }
          catch(e){ /* cancelado */ }
        } else {
          try{ await navigator.clipboard.writeText(realUrl); showToast('Enlace copiado'); }
          catch(e){ showToast(realUrl); }
        }
      });
    }

    document.querySelectorAll('[data-leave-calendar]').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        e.stopPropagation();
        if(!authUser || !ownCalendarId) return;
        const sharedId = btn.getAttribute('data-leave-calendar');
        const label = calendarLabels[sharedId] || 'este calendario';
        if(!confirm('¿Quieres dejar de tener acceso a "' + label + '"?')) return;
        try{
          await firebase.database().ref('users/'+ownCalendarId+'/shared/'+sharedId).remove();
          menuOpen = false;
          selected = null;
          if(calendarId === sharedId){
            loadCalendar(ownCalendarId, true);
          } else {
            render();
          }
          showToast('Has dejado el calendario compartido');
        }catch(e){
          showToast('No se pudo dejar el calendario');
        }
      });
    });

    const logoutBtn = document.getElementById('logoutBtn');
    if(logoutBtn){
      logoutBtn.addEventListener('click', async ()=>{
        menuOpen = false;
        if(mealsRef) mealsRef.off();
        if(ownCalendarId) firebase.database().ref('users/'+ownCalendarId+'/shared').off();
        sharedCalendars = {};
        calendarLabels = {};
        ownCalendarId = null;
        await firebase.auth().signOut();
      });
    }

    const shareDemoBtn = document.getElementById('shareDemoBtn');
    if(shareDemoBtn){
      shareDemoBtn.addEventListener('click', async ()=>{
        menuOpen = false;
        render();
        const demoUrl = window.location.origin + window.location.pathname + '?demo=1';
        if(navigator.share){
          try{
            await navigator.share({ title:'Qué comemos (demo)', url: demoUrl });
          }catch(e){ /* usuario canceló, no hacemos nada */ }
        } else {
          try{
            await navigator.clipboard.writeText(demoUrl);
            showToast('Enlace de demostración copiado');
          }catch(e){
            showToast(demoUrl);
          }
        }
      });
    }

    document.querySelectorAll('.cell-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const dateStr = btn.getAttribute('data-date');
        const type = btn.getAttribute('data-type');
        selected = {date:dateStr, type};
        focusDishOnOpen = true;
        render();
        renderEditPanel();
      });
    });

    if(selected) renderEditPanel();

    if(!didAutoScrollToday && weekOffset === 0){
      didAutoScrollToday = true;
      const todayCard = document.querySelector('.day-card.is-today');
      if(todayCard){
        setTimeout(()=>{ todayCard.scrollIntoView({behavior:'smooth', block:'center', inline:'center'}); }, 150);
      }
    }
  }

  function renderEditPanel(){
    const slot = document.getElementById('editSlot');
    if(!slot || !selected) return;
    const { date, type } = selected;
    const entry = data[key(date,type)] || {};
    const dObj = new Date(date+'T00:00:00');
    const dayLabel = `${DAY_NAMES[dObj.getDay()===0?6:dObj.getDay()-1]} ${dObj.getDate()} de ${MONTHS[dObj.getMonth()]}`;
    const defRem = defaultReminder(date);
    const hasReminder = !!entry.reminderDate;
    const remDate = entry.reminderDate || defRem.date;
    const remTime = entry.reminderTime || defRem.time;

    slot.innerHTML = `
      <div class="edit-panel">
        <h3>${type==='comida'?'Comida':'Cena'} · ${dayLabel}</h3>
        <div class="row">
          <div class="field">
            <label for="editDish">Plato</label>
            <input type="text" id="editDish" value="${escapeHtml(entry.dish||'')}" placeholder="Ej. Pollo al horno">
          </div>
        </div>
        <div class="btn-row" style="margin-bottom:14px;">
          <button type="button" class="btn ghost" id="randomDishBtn">🎲 Plato random</button>
          <button type="button" class="btn ghost" id="oldDishBtn">⏳ Hace tiempo que no...</button>
        </div>
        <div class="reminder-line">
          <input type="checkbox" id="editRemOn" ${hasReminder?'checked':''}>
          <label for="editRemOn" style="margin:0;">Recordatorio</label>
          <input type="date" id="editRemDate" value="${remDate}">
          <span>a las</span>
          <input type="time" id="editRemTime" value="${remTime}">
        </div>
        <div class="row">
          <div class="field">
            <label for="editRemTitle">Nombre del recordatorio</label>
            <input type="text" id="editRemTitle" value="${escapeHtml(entry.reminderTitle||'')}" placeholder="Ej. Sacar el pollo del congelador">
          </div>
        </div>
        <div class="btn-row">
          <button class="btn primary" id="saveCell">Guardar</button>
          ${entry.dish ? '<button class="btn danger" id="delCell">Eliminar</button>' : ''}
          <button class="btn ghost" id="closeCell">Cerrar</button>
        </div>
      </div>
    `;

    if(focusDishOnOpen){
      focusDishOnOpen = false;
      const dishInput = document.getElementById('editDish');
      if(dishInput){
        slot.scrollIntoView({behavior:'smooth', block:'center'});
        setTimeout(()=>{ dishInput.focus(); }, 250);
      }
    }

    document.getElementById('randomDishBtn').addEventListener('click', ()=>{
      const suggestion = randomOtherWeekDish();
      if(!suggestion){ showToast('Todavía no hay suficientes platos guardados en otras semanas'); return; }
      document.getElementById('editDish').value = suggestion;
    });

    document.getElementById('oldDishBtn').addEventListener('click', ()=>{
      const suggestion = leastRecentDish();
      if(!suggestion){ showToast('Todavía no hay suficiente histórico guardado'); return; }
      document.getElementById('editDish').value = suggestion;
    });

    document.getElementById('saveCell').addEventListener('click', ()=>{
      const dish = document.getElementById('editDish').value.trim();
      if(!dish){ showToast('Escribe el nombre del plato'); return; }
      const remOn = document.getElementById('editRemOn').checked;
      const rd = document.getElementById('editRemDate').value;
      const rt = document.getElementById('editRemTime').value;
      const remTitle = document.getElementById('editRemTitle').value.trim();
      const savedEntry = {
        dish,
        reminderDate: remOn ? rd : null,
        reminderTime: remOn ? rt : null,
        reminderTitle: remOn ? remTitle : null,
        notifiedLive: false
      };
      data[key(date,type)] = savedEntry;
      saveData();
      if(remOn){
        downloadIcs(savedEntry, date, type);
        showToast('Guardado y recordatorio descargado');
      } else {
        showToast('Guardado');
      }
      render();
    });

    const delBtn = document.getElementById('delCell');
    if(delBtn) delBtn.addEventListener('click', ()=>{
      delete data[key(date,type)];
      saveData();
      selected = null;
      render();
    });

    document.getElementById('closeCell').addEventListener('click', ()=>{
      selected = null;
      render();
    });
  }

  initRouting();
})();
</script>
</body>
</html>
